name: Pack and publish

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  pack_and_publish:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
    - uses: actions/checkout@v2
    - name: Pack
      run: | 
        VERSION=$(echo ${GITHUB_REF##*/})
        VERSION=$(echo $VERSION | sed -e 's/^v//')
        dotnet pack -c Release -o ./packages -p:PackageVersion=$VERSION

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}
    - name: Push to NuGet
      run: |
        dotnet nuget push ./packages/**/*.nupkg -s https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}} --no-symbols
