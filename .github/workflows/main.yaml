name: Main
run-name: Build & test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    name: Build, test & SonarQube
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mb-dot-dev/gha-sdk-images:1.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # SonarScanner for .NET ignores sonar-project.properties, so settings are passed as /d: args.
      - name: Install SonarScanner
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"molnarbence_MbUtils.Extensions"
          /o:"molnarbence"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/coverage.xml"
          /d:sonar.coverage.exclusions="test/**"
          /d:sonar.qualitygate.wait=true

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: >
          dotnet test -c Release --no-build
          --coverage --coverage-output-format xml --coverage-output coverage.xml

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
